<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Tech News Podcast — ScribNet</title>
  <meta name="description" content="Listen to the latest Daily Tech News podcast episode.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .player-wrap { min-height: 82vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .player-card { max-width: 34rem; width: 100%; text-align: center; }
    .player-card .pill { margin-bottom: 1rem; }
    audio { width: 100%; margin: 1.5rem 0 0.5rem; }
    .ep-div { width: 2.75rem; height: 3px; border-radius: 2px; background: var(--grad); margin: 1.4rem auto 0; }
    .ep-kicker { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); margin: 1.5rem 0 0.4rem; }
    .ep-title { font-size: 1.35rem; font-weight: 700; margin-top: 0; }
    .ep-date { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
    .player-links { margin-top: 1.75rem; display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .ep-filter { margin-top: 1.25rem; }
    .ep-filter label { display: block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--violet); margin-bottom: 0.5rem; }
    .ep-filter select { width: 100%; padding: 0.65rem 0.8rem; font: inherit; font-size: 0.95rem; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 0.6rem; cursor: pointer; }
    .ep-filter select:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .ep-filter select option { background-color: #0b0f18; color: #f2f5fa; }
  </style>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ScribNet">
  <meta property="og:title" content="Daily Tech News Podcast — ScribNet">
  <meta property="og:description" content="Listen to the latest Daily Tech News podcast episode.">
  <meta property="og:url" content="https://scribnet.io/podcast.html">
  <meta property="og:image" content="https://scribnet.io/og/og-home.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Daily Tech News Podcast — ScribNet">
  <meta name="twitter:description" content="Listen to the latest Daily Tech News podcast episode.">
  <meta name="twitter:image" content="https://scribnet.io/og/og-home.png">
</head>
<body>
  <div class="player-wrap">
    <div class="player-card">
      <div class="pill"><span class="dot"></span>scribnet.io</div>
      <div class="eyebrow">Podcast</div>
      <h1>Daily <span class="grad">Tech News</span></h1>
      <div class="ep-div"></div>
      <p class="ep-kicker">Latest episode</p>
      <p class="ep-title" id="ep-title">Loading today's episode…</p>
      <p class="ep-date" id="ep-date"></p>
      <audio id="player" controls preload="none"></audio>
      <div class="ep-filter">
        <label for="ep-select">Previous episodes</label>
        <select id="ep-select"></select>
      </div>
      <p class="subtitle">A 5-minute AI-hosted tech briefing with Alex &amp; Jordan, published every weekday morning.</p>
      <div class="player-links">
        <a class="btn ghost" href="https://scribnet.io/">← scribnet.io</a>
        <a class="btn ghost" href="https://muse.ai/podcasts/feed/1274343602436775/ac976877-8cb9-4172-82c1-4d6fe1ec508d">RSS feed →</a>
      </div>
    </div>
  </div>
  <script>
    const titleEl = document.getElementById('ep-title');
    const dateEl = document.getElementById('ep-date');
    const player = document.getElementById('player');
    const select = document.getElementById('ep-select');
    function loadEpisode(ep) {
      titleEl.textContent = ep.title;
      dateEl.textContent = ep.date || '';
      player.src = ep.url;
      player.load();
    }
    fetch('episodes.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(eps => {
        eps.forEach((ep, i) => {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = ep.title;
          select.appendChild(opt);
        });
        select.addEventListener('change', () => loadEpisode(eps[select.value]));
        loadEpisode(eps[0]);
      })
      .catch(() => { titleEl.textContent = 'Episodes unavailable — check back soon.'; });
  </script>
</body>
</html>
